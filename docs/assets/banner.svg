<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="title desc">
  <title id="title">ProofMerge</title>
  <desc id="desc">The same test runs on the original code and on the patch: base passes, patch fails, so the verdict is BLOCK.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16212E"/>
      <stop offset="1" stop-color="#1D2B3C"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <!-- verdict colours as a thin strip: pass, review, block -->
    <rect x="0" y="384" width="427" height="16" fill="#3FB950"/>
    <rect x="427" y="384" width="426" height="16" fill="#E3B341"/>
    <rect x="853" y="384" width="427" height="16" fill="#F0524F"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="168" font-size="88" font-weight="800" fill="#EEF2F6" letter-spacing="-2">ProofMerge</text>
    <text x="74" y="226" font-size="30" font-weight="600" fill="#6CA0FF">Don't trust AI-generated code.</text>
    <text x="74" y="266" font-size="30" font-weight="600" fill="#EEF2F6">Make it prove itself.</text>
    <text x="74" y="322" font-size="20" fill="#9FB0C3">Runs the same test on the original code and on the AI's patch.</text>
  </g>

  <!-- evidence card -->
  <g transform="translate(792 70)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <rect width="420" height="262" rx="16" fill="#0F1823" stroke="#2C3E52" stroke-width="2"/>
    <text x="32" y="48" font-size="18" fill="#9FB0C3">same test, two versions</text>

    <text x="32" y="106" font-size="28" fill="#EEF2F6">base</text>
    <circle cx="262" cy="96" r="17" fill="#3FB950"/>
    <path d="M253 96 l6 6 l12 -12" fill="none" stroke="#0F1823" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="294" y="106" font-size="28" fill="#3FB950">pass</text>

    <text x="32" y="162" font-size="28" fill="#EEF2F6">patch</text>
    <circle cx="262" cy="152" r="17" fill="#F0524F"/>
    <path d="M255 145 l14 14 M269 145 l-14 14" fill="none" stroke="#0F1823" stroke-width="4" stroke-linecap="round"/>
    <text x="294" y="162" font-size="28" fill="#F0524F">fail</text>

    <line x1="32" y1="190" x2="388" y2="190" stroke="#2C3E52" stroke-width="2"/>

    <text x="32" y="234" font-size="28" fill="#EEF2F6">verdict</text>
    <rect x="244" y="206" width="144" height="40" rx="20" fill="#F0524F"/>
    <text x="316" y="234" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">BLOCK</text>
  </g>
</svg>
