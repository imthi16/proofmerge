[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "proofmerge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer==0.27.3",
    "rich==15.0.0",
    "pydantic==2.14.1",
    "openai==3.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[project.scripts]
proofmerge = "proofmerge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/proofmerge"]

[tool.hatch.build.targets.wheel.force-include]
"docker/runner/Dockerfile" = "proofmerge/runner/Dockerfile"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
